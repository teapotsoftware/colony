<!DOCTYPE html>
<html>
<head>
	<title>Settlers of Circle Island</title>
	<link rel="icon" type="image/png" href="gamesprites/item_berries.png">
	<script src="colony.js" type="text/javascript"></script>
</head>
<body onload="init()">
	<style>
		body {
			background-color: Black;
		}
		.cursoroverride {
			cursor: url("gamesprites/cursor.png"), auto;
		}
		canvas {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
		}
		@font-face {
			font-family: "PixelPurl";
			src: url("PixelPurl.ttf") format("truetype");
		}
	</style>
	<div class="cursoroverride">
	<canvas id="gameCanvas" width="800" height="600">There was a problem loading the game ;_;</canvas>
	</div>
</body>
</html>
